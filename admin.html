<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>나들이go 관리자</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px;-webkit-font-smoothing:antialiased}

  /* ── 상단 헤더 ── */
  .topbar{background:linear-gradient(135deg,#ef8200 0%,#f59e0b 100%);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(239,130,0,.25)}
  .topbar .title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
  .topbar .title .emoji{font-size:22px}
  .topbar .links{display:flex;gap:14px;font-size:12px;align-items:center}
  .topbar a{color:rgba(255,255,255,.95);text-decoration:none;padding:6px 12px;background:rgba(255,255,255,.18);border-radius:18px;transition:.15s}
  .topbar a:hover{background:rgba(255,255,255,.3)}

  /* ── 통계 카드 ── */
  .stats{padding:16px 20px 0;display:flex;gap:10px;flex-wrap:wrap}
  .stat{flex:1;min-width:120px;background:#fff;padding:14px 16px;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .stat .label{font-size:11px;color:#64748b;font-weight:500;letter-spacing:.3px}
  .stat .value{font-size:22px;font-weight:700;color:#0f172a;margin-top:3px;line-height:1}
  .stat.orange .value{color:#ef8200}
  .stat.green .value{color:#16a34a}
  .stat.blue .value{color:#2563eb}

  /* ── 툴바 ── */
  .container{padding:16px 20px 80px;max-width:1400px;margin:0 auto}
  .toolbar{background:#fff;padding:12px;border-radius:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .toolbar input[type=text],.toolbar select{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;background:#fff;font-family:inherit;outline:none;transition:.15s}
  .toolbar input[type=text]:focus,.toolbar select:focus{border-color:#ef8200}
  .toolbar input[type=text]{flex:1;min-width:160px}
  .toolbar .spacer{flex:1}
  .btn{padding:9px 15px;border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
  .btn-primary{background:#ef8200;color:#fff}
  .btn-primary:hover{background:#d97706}
  .btn-secondary{background:#fff;color:#475569;border:1.5px solid #e2e8f0}
  .btn-secondary:hover{background:#f8fafc;border-color:#cbd5e1}
  .btn-danger{background:#fef2f2;color:#dc2626;border:1.5px solid #fecaca}
  .btn-danger:hover{background:#fee2e2}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}

  /* ── 뷰 전환 토글 ── */
  .view-toggle{display:inline-flex;background:#f1f5f9;padding:3px;border-radius:10px;gap:2px}
  .view-toggle button{background:transparent;border:none;padding:7px 14px;font-size:12px;font-weight:600;color:#64748b;cursor:pointer;border-radius:8px;transition:.15s}
  .view-toggle button.active{background:#fff;color:#ef8200;box-shadow:0 1px 3px rgba(0,0,0,.08)}

  /* ── 표 ── */
  .table-wrap{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
  thead{background:#f8fafc;position:sticky;top:0}
  th{text-align:left;padding:11px 12px;font-size:11px;font-weight:600;color:#64748b;border-bottom:1px solid #e2e8f0;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none}
  th:hover{color:#ef8200}
  th .sort-arrow{font-size:10px;opacity:.5;margin-left:3px}
  th.sorted .sort-arrow{opacity:1;color:#ef8200}
  td{padding:11px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  tr:hover td{background:#fafbfc}
  tr.idata td{background:linear-gradient(90deg,rgba(239,130,0,.04),transparent 30%)}
  td.thumb{width:50px}
  td.thumb img{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#f1f5f9;display:block}
  td.thumb .ph{width:42px;height:42px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:18px}
  td.title{font-weight:600;color:#0f172a;min-width:160px}
  td.title .badge{display:inline-block;background:#fef3c7;color:#92400e;font-size:10px;padding:1px 6px;border-radius:6px;margin-left:6px;font-weight:600;vertical-align:middle}
  td.title .sublabel{font-size:11px;color:#94a3b8;font-weight:400;margin-top:2px}
  .chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
  .chip-region{background:#eff6ff;color:#1e40af}
  .chip-tag{background:#f5f3ff;color:#6d28d9}
  .cong-bar{display:flex;align-items:center;gap:6px;min-width:80px}
  .cong-bar .bar{flex:1;height:5px;background:#f1f5f9;border-radius:3px;overflow:hidden}
  .cong-bar .fill{height:100%;border-radius:3px}
  .cong-bar .num{font-size:11px;color:#64748b;min-width:30px;font-weight:600}
  .row-actions{display:flex;gap:4px;justify-content:flex-end}
  .icon-btn{background:#f8fafc;border:1px solid #e2e8f0;width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:.15s;color:#64748b}
  .icon-btn:hover{background:#fff;border-color:#cbd5e1}
  .icon-btn.del:hover{background:#fef2f2;border-color:#fecaca;color:#dc2626}
  .icon-btn.fav.on{background:#fef3c7;border-color:#fde68a;color:#d97706}

  /* ── 카드 그리드 ── */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:.15s;cursor:pointer;position:relative}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
  .card .img{width:100%;height:140px;background:#f1f5f9 center/cover;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:36px;position:relative}
  .card .idata-badge{position:absolute;top:8px;left:8px;background:#ef8200;color:#fff;font-size:10px;padding:3px 8px;border-radius:8px;font-weight:700;letter-spacing:.3px}
  .card .body{padding:12px 14px}
  .card .ctitle{font-weight:700;color:#0f172a;font-size:14px;margin-bottom:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .card .cloc{font-size:11px;color:#64748b;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .card .cmeta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
  .card .cactions{display:flex;gap:5px;border-top:1px solid #f1f5f9;padding-top:10px;margin-top:10px}
  .card .cactions .icon-btn{flex:1;height:32px}

  /* ── 모바일 표 → 카드 자동 ── */
  @media (max-width:640px){
    .topbar{padding:12px 14px}
    .topbar .title{font-size:14px}
    .container{padding:12px 14px 80px}
    .stats{padding:12px 14px 0}
    .stat{min-width:0;padding:10px 12px}
    .stat .value{font-size:18px}
    .toolbar{padding:10px}
    .toolbar input[type=text],.toolbar select,.btn{font-size:12px}
    .card-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .card .img{height:100px;font-size:28px}
  }

  /* ── 빈 상태 ── */
  .empty{padding:60px 20px;text-align:center;color:#94a3b8}
  .empty .emoji{font-size:42px;margin-bottom:10px}
  .empty .msg{font-size:14px}

  /* ── 로딩 ── */
  .loading{padding:60px;text-align:center;color:#94a3b8}
  .spinner{display:inline-block;width:24px;height:24px;border:3px solid #e2e8f0;border-top-color:#ef8200;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── 모달 ── */
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:14px;animation:fadeIn .15s ease-out}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideUp .2s ease-out}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-head{padding:16px 20px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center}
  .modal-head h2{font-size:16px;font-weight:700;color:#0f172a}
  .modal-head .close{background:none;border:none;font-size:24px;cursor:pointer;color:#94a3b8;line-height:1;padding:4px}
  .modal-body{padding:20px;overflow-y:auto;flex:1}
  .modal-foot{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end;gap:8px;background:#fafbfc;border-radius:0 0 16px 16px}

  /* ── 폼 ── */
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .form-row.full{grid-template-columns:1fr}
  .field label{display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:5px;letter-spacing:.3px}
  .field label .req{color:#dc2626}
  .field input,.field textarea,.field select{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;font-family:inherit;outline:none;transition:.15s}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:#ef8200}
  .field textarea{resize:vertical;min-height:60px}
  .field .hint{font-size:10px;color:#94a3b8;margin-top:3px}
  .img-preview{margin-top:6px;border-radius:10px;overflow:hidden;background:#f1f5f9;max-height:140px;display:flex;align-items:center;justify-content:center}
  .img-preview img{max-width:100%;max-height:140px;display:block}
  .img-preview .ph{padding:24px 0;color:#94a3b8;font-size:11px}
  .chk-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fef3c7;border-radius:10px;cursor:pointer}
  .chk-row input{width:18px;height:18px;cursor:pointer}
  .chk-row label{font-size:13px;color:#92400e;font-weight:600;cursor:pointer;margin:0}
  .form-section{margin-top:14px;padding-top:14px;border-top:1px dashed #e2e8f0}
  .form-section:first-of-type{margin-top:0;padding-top:0;border-top:none}
  .section-title{font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .section-title .add-btn{background:#ef8200;color:#fff;border:none;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:0}
  .section-title .add-btn:hover{background:#d97706}

  /* 프로그램 항목 */
  .prog-list{display:flex;flex-direction:column;gap:8px}
  .prog-item{background:#fafbfc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;position:relative}
  .prog-item .row{display:grid;grid-template-columns:90px 1fr;gap:8px;margin-bottom:6px;align-items:center}
  .prog-item .row:last-child{margin-bottom:0}
  .prog-item input{padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:7px;font-size:12px;font-family:inherit;outline:none;background:#fff}
  .prog-item input:focus{border-color:#ef8200}
  .prog-item .lbl{font-size:11px;color:#64748b;font-weight:600;padding-left:4px}
  .prog-item .del-x{position:absolute;top:6px;right:6px;background:#fef2f2;color:#dc2626;border:none;width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .prog-item .del-x:hover{background:#fee2e2}
  .prog-empty{text-align:center;padding:18px;color:#94a3b8;font-size:12px;background:#fafbfc;border:1.5px dashed #e2e8f0;border-radius:10px}

  /* 굿즈 사진 미리보기 */
  .goods-thumb{width:100%;max-width:120px;height:90px;background:#f1f5f9 center/cover;border-radius:8px;margin-top:4px;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:22px}
  .goods-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
  .goods-badge{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600}
  .gb-discount{background:#fef2f2;color:#dc2626}
  .gb-soldout{background:#1f2937;color:#fff}

  /* ── 토스트 ── */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 20px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:500;font-size:13px;font-weight:500;animation:toastIn .25s ease-out}
  .toast.success{background:#16a34a}
  .toast.error{background:#dc2626}
  @keyframes toastIn{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

  /* ── 비밀번호 게이트 ── */
  .gate{position:fixed;inset:0;background:linear-gradient(135deg,#fef3c7 0%,#fde68a 100%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .gate-box{background:#fff;padding:36px 30px;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.15);max-width:340px;width:100%;text-align:center}
  .gate-box .emoji{font-size:48px;margin-bottom:14px}
  .gate-box h1{font-size:18px;font-weight:700;color:#0f172a;margin-bottom:8px}
  .gate-box p{font-size:13px;color:#64748b;margin-bottom:20px}
  .gate-box input{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;margin-bottom:12px;text-align:center;font-family:inherit}
  .gate-box input:focus{outline:none;border-color:#ef8200}
  .gate-box button{width:100%;padding:12px;background:#ef8200;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  .gate-box .err{color:#dc2626;font-size:12px;margin-bottom:10px;display:none}
</style>
</head>
<body>

<!-- 비밀번호 게이트 -->
<div class="gate" id="gate" style="display:none">
  <div class="gate-box">
    <div class="emoji">🔐</div>
    <h1>관리자 인증</h1>
    <p>나들이go 축제 관리 페이지입니다.<br>관리자 키를 입력해주세요.</p>
    <div class="err" id="gate-err">키가 올바르지 않습니다</div>
    <input type="password" id="gate-pw" placeholder="관리자 키" autocomplete="off">
    <button onclick="checkGate()">접속</button>
  </div>
</div>

<!-- 본문 (인증 후 표시) -->
<div id="app" style="display:none">

  <div class="topbar">
    <div class="title"><span class="emoji">🎪</span> 나들이go 축제 관리자</div>
    <div class="links">
      <a href="https://idataoffer-prog.github.io/nadeuigo-web/ktrip.html" target="_blank">👁 소비자 앱</a>
      <a href="#" onclick="logoutGate();return false">🚪 종료</a>
    </div>
  </div>

  <!-- 관리 영역 전환 탭 -->
  <div style="display:flex;background:#fff;border-bottom:1px solid #e2e8f0;">
    <div id="mtab-fest" onclick="switchMgr('fest')" style="flex:1;padding:13px;text-align:center;font-size:14px;font-weight:700;color:#ef8200;cursor:pointer;border-bottom:2.5px solid #ef8200;">🎪 축제 관리</div>
    <div id="mtab-users" onclick="switchMgr('users')" style="flex:1;padding:13px;text-align:center;font-size:14px;font-weight:700;color:#94a3b8;cursor:pointer;border-bottom:2.5px solid transparent;">👤 회원 관리</div>
    <div id="mtab-posts" onclick="switchMgr('posts')" style="flex:1;padding:13px;text-align:center;font-size:14px;font-weight:700;color:#94a3b8;cursor:pointer;border-bottom:2.5px solid transparent;">📋 게시물 관리</div>
  </div>

  <div id="mgr-fest">
  <div class="stats">
    <div class="stat"><div class="label">전체 축제</div><div class="value" id="stat-total">-</div></div>
    <div class="stat orange"><div class="label">⚡ VESTOR 운영</div><div class="value" id="stat-idata">-</div></div>
    <div class="stat green"><div class="label">진행중</div><div class="value" id="stat-ongoing">-</div></div>
    <div class="stat blue"><div class="label">예정</div><div class="value" id="stat-upcoming">-</div></div>
  </div>

  <div class="container">
    <div class="toolbar">
      <input type="text" id="search" placeholder="🔍 축제명/주소 검색...">
      <select id="filter-region">
        <option value="">전체 지역</option>
        <option>서울</option><option>경기</option><option>인천</option>
        <option>강원</option><option>충북</option><option>충남</option>
        <option>대전</option><option>세종</option><option>경북</option>
        <option>경남</option><option>대구</option><option>부산</option>
        <option>울산</option><option>전북</option><option>전남</option>
        <option>광주</option><option>제주</option>
      </select>
      <select id="filter-tag">
        <option value="">전체 태그</option>
        <option>꽃축제</option><option>여름축제</option><option>가을축제</option>
        <option>겨울축제</option><option>야간축제</option><option>음악축제</option>
        <option>전통문화</option><option>먹거리</option><option>문화예술</option>
        <option>가족축제</option><option>지역축제</option>
      </select>
      <select id="filter-idata">
        <option value="">전체</option>
        <option value="1">⚡ VESTOR 운영만</option>
        <option value="0">일반 축제만</option>
      </select>
      <div class="view-toggle">
        <button id="vt-table" class="active" onclick="switchView('table')">📋 표</button>
        <button id="vt-card" onclick="switchView('card')">🎴 카드</button>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-secondary btn-sm" onclick="openCategoryManager()">🏷️ 카테고리 관리</button>
      <button class="btn btn-secondary btn-sm" onclick="openVDeviceManager()">⚡ 장비 관리</button>
      <button class="btn btn-secondary btn-sm" onclick="downloadCSV()">📥 CSV</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('csv-file').click()">📤 CSV 가져오기</button>
      <input type="file" id="csv-file" accept=".csv" style="display:none" onchange="uploadCSV(this)">
      <button class="btn btn-primary" onclick="openEdit(null)">➕ 새 축제</button>
    </div>

    <!-- 표 뷰 -->
    <div class="table-wrap" id="view-table">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th></th>
              <th data-sort="title">축제명 <span class="sort-arrow">↕</span></th>
              <th data-sort="region">지역</th>
              <th data-sort="tag">태그</th>
              <th data-sort="date">기간 <span class="sort-arrow">↕</span></th>
              <th data-sort="cong">혼잡도 <span class="sort-arrow">↕</span></th>
              <th data-sort="rating">평점</th>
              <th style="text-align:right">작업</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="8" class="loading"><div class="spinner"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 카드 뷰 -->
    <div class="card-grid" id="view-card" style="display:none"></div>
  </div>
  </div><!-- /mgr-fest -->

  <!-- ═══ 회원 관리 ═══ -->
  <div id="mgr-users" style="display:none;max-width:860px;margin:0 auto;padding:16px;">
    <input id="u-search" placeholder="🔍 닉네임 / 아이디 검색" oninput="renderUsers()"
      style="width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid #e2e8f0;font-size:14px;outline:none;margin-bottom:14px;font-family:inherit;">

<script>
// ─────────────────────────────────────────────────────────────
// Firebase 설정 (nadeuigo 프로젝트)
// ─────────────────────────────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBhpg4MPy4flD2SNf5phjhtfnJFzw11_n0",
  authDomain: "nadeuigo.firebaseapp.com",
  projectId: "nadeuigo",
  storageBucket: "nadeuigo.firebasestorage.app",
  messagingSenderId: "965028961921",
  appId: "1:965028961921:web:6ec49ee4cae8903d467780"
};
const ADMIN_KEY = 'idata2026';

let db, storage;
let festivals = [];        // 전체 목록
let view = 'table';        // 'table' | 'card'
let sortKey = '_order';    // 정렬 기준
let sortAsc = true;

// ─────────────────────────────────────────────────────────────
// 비밀번호 게이트
// ─────────────────────────────────────────────────────────────
function initGate(){
  const urlKey = new URLSearchParams(location.search).get('key');
  const savedKey = localStorage.getItem('nadeuri_admin_key');
  if(urlKey === ADMIN_KEY || savedKey === ADMIN_KEY){
    if(urlKey === ADMIN_KEY) localStorage.setItem('nadeuri_admin_key', ADMIN_KEY);
    startApp();
  }else{
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('gate-pw').focus();
    document.getElementById('gate-pw').addEventListener('keydown', e=>{
      if(e.key==='Enter') checkGate();
    });
  }
}
function checkGate(){
  const pw = document.getElementById('gate-pw').value;
  if(pw === ADMIN_KEY){
    localStorage.setItem('nadeuri_admin_key', ADMIN_KEY);
    document.getElementById('gate').style.display = 'none';
    startApp();
  }else{
    document.getElementById('gate-err').style.display = 'block';
  }
}
function logoutGate(){
  if(!confirm('관리자 모드를 종료하시겠습니까?')) return;
  localStorage.removeItem('nadeuri_admin_key');
  location.href = location.pathname; // ?key 파라미터 제거하고 새로고침
}

// ─────────────────────────────────────────────────────────────
// 앱 시작
// ─────────────────────────────────────────────────────────────
async function startApp(){
  document.getElementById('app').style.display = 'block';
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    try{ storage = firebase.storage(); }catch(e){}
    await loadCategories();
    await loadVDevices();
    await loadFestivals();
    bindEvents();
  }catch(err){
    toast('Firebase 초기화 실패: '+err.message, 'error');
  }
}

async function loadFestivals(){
  try{
    const snap = await db.collection('festivals').orderBy('_order').get();
    festivals = snap.docs.map(d=>({...d.data(), docId:d.id}));
    render();
    updateStats();
  }catch(err){
    document.getElementById('tbody').innerHTML = `<tr><td colspan="8" class="empty"><div class="emoji">⚠️</div><div class="msg">로드 실패: ${escapeHtml(err.message)}</div></td></tr>`;
  }
}

// ─────────────────────────────────────────────────────────────
// 필터링 + 정렬
// ─────────────────────────────────────────────────────────────
function getFiltered(){
  const search = document.getElementById('search').value.trim().toLowerCase();
  const region = document.getElementById('filter-region').value;
  const tag = document.getElementById('filter-tag').value;
  const idata = document.getElementById('filter-idata').value;

  let arr = festivals.filter(f=>{
    if(search && !((f.title||'').toLowerCase().includes(search) || (f.loc||'').toLowerCase().includes(search))) return false;
    if(region && f.region !== region) return false;
    if(tag && f.tag !== tag) return false;
    if(idata === '1' && !f.idata) return false;
    if(idata === '0' && f.idata) return false;
    return true;
  });

  // 정렬
  arr.sort((a,b)=>{
    let av = a[sortKey], bv = b[sortKey];
    if(av==null) av = '';
    if(bv==null) bv = '';
    if(typeof av === 'string') av = av.toLowerCase();
    if(typeof bv === 'string') bv = bv.toLowerCase();
    if(av < bv) return sortAsc ? -1 : 1;
    if(av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  return arr;
}

// ─────────────────────────────────────────────────────────────
// 렌더링
// ─────────────────────────────────────────────────────────────
function render(){
  const arr = getFiltered();
  if(view === 'table') renderTable(arr);
  else renderCards(arr);
}

function renderTable(arr){
  const tbody = document.getElementById('tbody');
  if(!arr.length){
    tbody.innerHTML = `<tr><td colspan="8" class="empty"><div class="emoji">🎪</div><div class="msg">조건에 맞는 축제가 없습니다</div></td></tr>`;
    return;
  }
  tbody.innerHTML = arr.map(f=>`
    <tr class="${f.idata?'idata':''}">
      <td class="thumb">${f.img ? `<img src="${escapeHtml(f.img)}" onerror="this.outerHTML='<div class=ph>🎪</div>'">` : `<div class="ph">🎪</div>`}</td>
      <td class="title">
        ${escapeHtml(f.title)}${f.idata?'<span class="badge">⚡VESTOR</span>':''}
        ${f.loc?`<div class="sublabel">${escapeHtml(f.loc)}</div>`:''}
      </td>
      <td>${f.region?`<span class="chip chip-region">${escapeHtml(f.region)}</span>`:'<span style="color:#cbd5e1">-</span>'}</td>
      <td>${f.tag?`<span class="chip chip-tag">${escapeHtml(f.tag)}</span>`:'<span style="color:#cbd5e1">-</span>'}</td>
      <td style="font-size:12px;color:#475569;white-space:nowrap">${escapeHtml(f.date||'-')}</td>
      <td>${congBar(f.cong)}</td>
      <td style="font-size:12px;color:#475569">⭐ ${f.rating!=null?f.rating:'-'}</td>
      <td><div class="row-actions">
        <button class="icon-btn fav ${f.idata?'on':''}" onclick="toggleIdata('${f.docId}')" title="VESTOR 운영 토글">⚡</button>
        <button class="icon-btn" onclick="openEdit('${f.docId}')" title="수정">✏️</button>
        <button class="icon-btn del" onclick="deleteOne('${f.docId}','${escapeAttr(f.title)}')" title="삭제">🗑</button>
      </div></td>
    </tr>
  `).join('');
}

function renderCards(arr){
  const grid = document.getElementById('view-card');
  if(!arr.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="emoji">🎪</div><div class="msg">조건에 맞는 축제가 없습니다</div></div>`;
    return;
  }
  grid.innerHTML = arr.map(f=>`
    <div class="card" onclick="openEdit('${f.docId}')">
      <div class="img" style="${f.img?`background-image:url('${escapeAttr(f.img)}')`:''}">${!f.img?'🎪':''}
        ${f.idata?'<div class="idata-badge">⚡ VESTOR</div>':''}
      </div>
      <div class="body">
        <div class="ctitle">${escapeHtml(f.title)}</div>
        <div class="cloc">📍 ${escapeHtml(f.loc||'-')}</div>
        <div class="cmeta">
          ${f.region?`<span class="chip chip-region">${escapeHtml(f.region)}</span>`:''}
          ${f.tag?`<span class="chip chip-tag">${escapeHtml(f.tag)}</span>`:''}
        </div>
        <div style="font-size:11px;color:#64748b">📅 ${escapeHtml(f.date||'미정')} · 혼잡 ${f.cong||0}%</div>
        <div class="cactions" onclick="event.stopPropagation()">
          <button class="icon-btn fav ${f.idata?'on':''}" onclick="toggleIdata('${f.docId}')">⚡</button>
          <button class="icon-btn" onclick="openEdit('${f.docId}')">✏️</button>
          <button class="icon-btn del" onclick="deleteOne('${f.docId}','${escapeAttr(f.title)}')">🗑</button>
        </div>
      </div>
    </div>
  `).join('');
}

function congBar(cong){
  const c = cong||0;
  const color = c>=70?'#dc2626':c>=40?'#f59e0b':'#16a34a';
  return `<div class="cong-bar"><div class="bar"><div class="fill" style="width:${c}%;background:${color}"></div></div><span class="num">${c}%</span></div>`;
}

function updateStats(){
  document.getElementById('stat-total').textContent = festivals.length;
  document.getElementById('stat-idata').textContent = festivals.filter(f=>f.idata).length;
  const today = new Date().toISOString().slice(0,10);
  // date 필드는 "05.18 - 05.25" 형식이라 정확한 진행중 판단이 어렵지만 대략 처리
  let ongoing = 0, upcoming = 0;
  const now = new Date();
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  const today2 = mm+'.'+dd;
  festivals.forEach(f=>{
    if(!f.date) return;
    const m = f.date.match(/(\d{2})\.(\d{2})\s*-\s*(\d{2})\.(\d{2})/);
    if(m){
      const start = m[1]+'.'+m[2], end = m[3]+'.'+m[4];
      if(today2 >= start && today2 <= end) ongoing++;
      else if(today2 < start) upcoming++;
    }
  });
  document.getElementById('stat-ongoing').textContent = ongoing;
  document.getElementById('stat-upcoming').textContent = upcoming;
}

// ─────────────────────────────────────────────────────────────
// 뷰 전환 & 이벤트
// ─────────────────────────────────────────────────────────────
function switchView(v){
  view = v;
  document.getElementById('vt-table').classList.toggle('active', v==='table');
  document.getElementById('vt-card').classList.toggle('active', v==='card');
  document.getElementById('view-table').style.display = v==='table'?'block':'none';
  document.getElementById('view-card').style.display = v==='card'?'grid':'none';
  render();
}

function bindEvents(){
  document.getElementById('search').addEventListener('input', debounce(render, 200));
  document.getElementById('filter-region').addEventListener('change', render);
  document.getElementById('filter-tag').addEventListener('change', render);
  document.getElementById('filter-idata').addEventListener('change', render);
  document.querySelectorAll('th[data-sort]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.sort;
      if(sortKey === k) sortAsc = !sortAsc;
      else { sortKey = k; sortAsc = true; }
      document.querySelectorAll('th').forEach(t=>t.classList.remove('sorted'));
      th.classList.add('sorted');
      render();
    });
  });
}

function debounce(fn, ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)};}

// ─────────────────────────────────────────────────────────────
// ─── VESTOR 장비 목록 (한 번 등록 → 축제마다 체크로 선택) ───
let VDEVICES = [];
async function loadVDevices(){
  try{
    const doc = await db.collection('settings').doc('vestorDevices').get();
    VDEVICES = (doc.exists && Array.isArray(doc.data().list)) ? doc.data().list : [];
  }catch(e){ VDEVICES = []; }
}
async function saveVDevices(){
  try{
    await db.collection('settings').doc('vestorDevices').set({ list: VDEVICES, updatedAt: new Date().toISOString() });
  }catch(e){ toast('장비 목록 저장 실패: '+e.message, 'error'); }
}
function openVDeviceManager(){
  const old = document.getElementById('vdev-overlay'); if(old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'vdev-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;';
  ov.onclick = e => { if(e.target === ov) ov.remove(); };
  const sheet = document.createElement('div');
  sheet.style.cssText = 'background:#fff;border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:80vh;overflow-y:auto;';
  sheet.innerHTML = `
    <h2 style="margin:0 0 4px;font-size:19px;font-weight:800;color:#0f172a">⚡ VESTOR 계수기 관리</h2>
    <p style="margin:0 0 16px;font-size:12px;color:#94a3b8">여기 등록한 장비가 축제 편집 화면에 체크박스로 나타납니다.</p>
    <div id="vdev-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;"></div>
    <div style="display:flex;gap:8px;">
      <input id="vdev-serial" placeholder="장비번호 (예: 2424001)" style="flex:1;padding:11px 13px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:13px;outline:none;">
      <input id="vdev-name" placeholder="설명 (예: 주출입구)" style="flex:1;padding:11px 13px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:13px;outline:none;">
      <button onclick="addVDevice()" style="padding:11px 18px;border-radius:10px;border:none;background:#ef8200;color:#fff;font-size:13px;font-weight:700;cursor:pointer;">추가</button>
    </div>
    <div style="margin-top:14px;border-top:1px solid #f1f5f9;padding-top:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <b style="font-size:13px;color:#0f172a;">📋 일괄 등록</b>
        <span style="font-size:11px;color:#94a3b8;">한 줄에 한 대 · "번호 설명" 형식 (엑셀 복사-붙여넣기 가능)</span>
      </div>
      <textarea id="vdev-bulk" placeholder="2424001 주출입구&#10;2424002 해수욕장 입구&#10;2424003 머드광장" style="width:100%;height:110px;padding:11px 13px;border-radius:10px;border:1.5px solid #e2e8f0;font-size:13px;outline:none;resize:vertical;font-family:inherit;box-sizing:border-box;"></textarea>
      <button onclick="bulkAddVDevices()" style="width:100%;margin-top:8px;padding:11px;border-radius:10px;border:none;background:#0f172a;color:#fff;font-size:13px;font-weight:700;cursor:pointer;">한 번에 등록</button>
    </div>`;
  ov.appendChild(sheet);
  document.body.appendChild(ov);
  renderVDeviceList();
}
function renderVDeviceList(){
  const box = document.getElementById('vdev-list');
  if(!box) return;
  if(!VDEVICES.length){
    box.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:13px;padding:24px 0;">아직 등록된 장비가 없어요</div>';
    return;
  }
  box.innerHTML = VDEVICES.map((dv, i) => `
    <div style="display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:11px 14px;">
      <b style="font-size:13px;color:#0f172a;">${escapeHtml(dv.id)}</b>
      <span style="font-size:12px;color:#94a3b8;flex:1;">${escapeHtml(dv.name||'')}</span>
      <span onclick="delVDevice(${i})" style="color:#dc2626;font-size:13px;font-weight:700;cursor:pointer;">삭제</span>
    </div>`).join('');
}
async function addVDevice(){
  const s = document.getElementById('vdev-serial');
  const n = document.getElementById('vdev-name');
  const id = (s.value||'').trim();
  if(!/^[0-9A-Za-z_-]{3,30}$/.test(id)){ toast('장비번호를 확인해주세요 (영문·숫자 3~30자)', 'error'); return; }
  if(VDEVICES.some(d => d.id === id)){ toast('이미 등록된 장비예요', 'error'); return; }
  VDEVICES.push({ id: id, name: (n.value||'').trim() });
  s.value = ''; n.value = '';
  await saveVDevices();
  renderVDeviceList();
  toast('장비가 등록되었습니다');
}
async function bulkAddVDevices(){
  const ta = document.getElementById('vdev-bulk');
  const lines = (ta.value||'').split('\n').map(l => l.trim()).filter(Boolean);
  if(!lines.length){ toast('등록할 내용을 붙여넣어 주세요', 'error'); return; }
  let added = 0, dup = 0, bad = 0;
  lines.forEach(line => {
    // 구분: 공백/탭/쉼표 — 첫 토큰이 번호, 나머지가 설명
    const parts = line.split(/[\s,\t]+/).filter(Boolean);
    const id = parts[0];
    const name = parts.slice(1).join(' ');
    if(!/^[0-9A-Za-z_-]{3,30}$/.test(id)){ bad++; return; }
    if(VDEVICES.some(d => d.id === id)){ dup++; return; }
    VDEVICES.push({ id: id, name: name });
    added++;
  });
  if(added > 0) await saveVDevices();
  renderVDeviceList();
  ta.value = '';
  toast(added + '대 등록 완료' + (dup ? ' · 중복 ' + dup + '대 제외' : '') + (bad ? ' · 형식 오류 ' + bad + '줄' : ''));
}
async function delVDevice(i){
  if(!confirm('이 장비를 목록에서 삭제할까요?\n(이미 축제에 연결된 설정은 유지됩니다)')) return;
  VDEVICES.splice(i, 1);
  await saveVDevices();
  renderVDeviceList();
}

// 카테고리 관리 (Firestore 연동)
// ─────────────────────────────────────────────────────────────
let CATEGORIES = {
  regions: ['서울','경기','인천','강원','충북','충남','대전','세종','경북','경남','대구','부산','울산','전북','전남','광주','제주'],
  tags: ['꽃축제','여름축제','가을축제','겨울축제','야간축제','음악축제','전통문화','먹거리','문화예술','가족축제','지역축제']
};

// Firestore에서 카테고리 로드
async function loadCategories(){
  try {
    const doc = await db.collection('settings').doc('categories').get();
    if(doc.exists){
      const data = doc.data();
      if(Array.isArray(data.regions) && data.regions.length > 0){
        CATEGORIES.regions = data.regions;
      }
      if(Array.isArray(data.tags) && data.tags.length > 0){
        CATEGORIES.tags = data.tags;
      }
      console.log('✓ 카테고리 로드 완료');
    } else {
      // 문서 없으면 기본값으로 생성
      await saveCategories();
    }
    updateFilterDropdowns();
  } catch(e) {
    console.error('카테고리 로드 실패:', e);
  }
}

// Firestore에 카테고리 저장
async function saveCategories(){
  try {
    await db.collection('settings').doc('categories').set({
      regions: CATEGORIES.regions,
      tags: CATEGORIES.tags,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return true;
  } catch(e) {
    console.error('카테고리 저장 실패:', e);
    return false;
  }
}

// 상단 필터 드롭다운 갱신
function updateFilterDropdowns(){
  const filterRegion = document.getElementById('filter-region');
  if(filterRegion){
    const current = filterRegion.value;
    filterRegion.innerHTML = '<option value="">전체 지역</option>' + 
      CATEGORIES.regions.map(r=>`<option value="${escapeAttr(r)}">${escapeAttr(r)}</option>`).join('');
    filterRegion.value = current;
  }
  const filterTag = document.getElementById('filter-tag');
  if(filterTag){
    const current = filterTag.value;
    filterTag.innerHTML = '<option value="">전체 태그</option>' + 
      CATEGORIES.tags.map(t=>`<option value="${escapeAttr(t)}">${escapeAttr(t)}</option>`).join('');
    filterTag.value = current;
  }
}

  const box = document.createElement('div');

// 카테고리 목록 렌더링
function renderCategoryList(type){
  const list = document.getElementById('cat-' + type + '-list');
  if(!list) return;
  
  if(CATEGORIES[type].length === 0){
    list.innerHTML = '<div style="color:#94a3b8;font-size:13px;padding:8px">카테고리가 없습니다</div>';
    return;
  }
  
  list.innerHTML = CATEGORIES[type].map((cat, idx) => `
    <div style="display:inline-flex;align-items:center;gap:4px;background:#f1f5f9;padding:6px 6px 6px 12px;border-radius:9999px;font-size:13px;color:#1e293b">
      <span>${escapeAttr(cat)}</span>
      <button onclick="removeCategory('${type}', ${idx})" 
              style="background:#cbd5e1;color:#fff;border:none;width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0">✕</button>
    </div>
  `).join('');
}

// 카테고리 추가
async function addCategory(type){
  const input = document.getElementById('cat-' + type + '-input');
  const value = input.value.trim();
  
  if(!value){
    toast('카테고리 이름을 입력해주세요', 'error');
    return;
  }
  
  if(value.length > 20){
    toast('20자 이내로 입력해주세요', 'error');
    return;
  }
  
  if(CATEGORIES[type].includes(value)){
    toast('이미 존재하는 카테고리입니다', 'error');
    return;
  }
  
  CATEGORIES[type].push(value);
  input.value = '';
  renderCategoryList(type);
  
  const success = await saveCategories();
  if(success){
    toast('카테고리가 추가되었습니다', 'success');
    updateFilterDropdowns();
  } else {
    // 실패하면 롤백
    CATEGORIES[type].pop();
    renderCategoryList(type);
    toast('저장 실패', 'error');
  }
}

// 카테고리 삭제
async function removeCategory(type, idx){
  const name = CATEGORIES[type][idx];
  if(!confirm(`"${name}" 카테고리를 삭제하시겠습니까?\n\n축제 데이터의 카테고리 값은 그대로 유지됩니다.`)){
    return;
  }
  
  const removed = CATEGORIES[type].splice(idx, 1);
  renderCategoryList(type);
  
  const success = await saveCategories();
  if(success){
    toast('카테고리가 삭제되었습니다', 'success');
    updateFilterDropdowns();
  } else {
    // 실패하면 롤백
    CATEGORIES[type].splice(idx, 0, removed[0]);
    renderCategoryList(type);
    toast('삭제 실패', 'error');
  }
}

// ─── 편집 모달 섹션 바로가기 (포스트잇 칩) ───
function buildEditSectionNav(){
  try{
    const body = document.querySelector('.modal-body');
    if(!body) return;
    const old = document.getElementById('edit-sec-nav'); if(old) old.remove();
    const titles = Array.from(body.querySelectorAll('.section-title'));
    if(titles.length < 3) return;
    // 각 섹션에 앵커 id 부여 + 스크롤 여백
    const chips = [];
    titles.forEach((t, i) => {
      t.id = 'esec-' + i;
      t.style.scrollMarginTop = '58px';
      // 라벨: 이모지 포함 첫 단어들만 짧게
      let label = (t.textContent || '').trim().replace(/\s+/g,' ');
      label = label.split('(')[0].trim();          // 괄호 설명 제거
      label = label.replace(/ ?\+ ?추가.*$/,'').trim(); // 추가 버튼 텍스트 제거
      if(label.length > 8) label = label.slice(0, 8);
      chips.push({ id: t.id, label });
    });
    const nav = document.createElement('div');
    nav.id = 'edit-sec-nav';
    nav.style.cssText = 'position:sticky;top:-20px;z-index:20;background:#fff;margin:-20px -20px 16px;'
      + 'padding:12px 16px;border-bottom:1px solid #f1f5f9;display:flex;gap:6px;overflow-x:auto;'
      + '-webkit-overflow-scrolling:touch;white-space:nowrap;';
    chips.forEach(c => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.textContent = c.label;
      chip.style.cssText = 'flex-shrink:0;padding:7px 13px;border-radius:9999px;border:1px solid #e2e8f0;'
        + 'background:#fffbeb;color:#92600a;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;';
      chip.onclick = () => {
        const el = document.getElementById(c.id);
        if(el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      nav.appendChild(chip);
    });
    body.insertBefore(nav, body.firstChild);
  }catch(e){}
}

let _progItems = [];

// 시간 옵션 생성 (00:00 ~ 23:30, 30분 단위)
function getTimeOptions(selectedValue){
  let options = '<option value="">선택</option>';
  for(let h = 0; h < 24; h++){
    for(let m = 0; m < 60; m += 30){
      const hh = String(h).padStart(2, '0');
      const mm = String(m).padStart(2, '0');
      const time = `${hh}:${mm}`;
      // 한국어 표시 (오전/오후 X시 X분)
      let display;
      if(h === 0) display = `오전 12:${mm}`;
      else if(h < 12) display = `오전 ${h}:${mm}`;
      else if(h === 12) display = `오후 12:${mm}`;
      else display = `오후 ${h - 12}:${mm}`;
      
      const selected = (selectedValue === time || selectedValue === display) ? 'selected' : '';
      options += `<option value="${time}" ${selected}>${display} (${time})</option>`;
    }
  }
  return options;
}

function renderProgList(items){
  _progItems = items.map(it=>({...it}));
  const box = document.getElementById('prog-list');
  if(!box) return;
  if(!_progItems.length){
    box.innerHTML = `<div class="prog-empty">아직 등록된 프로그램이 없습니다.<br>위의 "📊 엑셀 업로드" 또는 "+ 항목 추가" 버튼을 사용해보세요.</div>`;
    return;
  }
  
  // 카테고리별로 그룹화
  const grouped = {};
  _progItems.forEach((it, idx) => {
    const cat = it.category || '일자별';
    const dateKey = it.date || '기타';
    const groupKey = cat === '일자별' ? dateKey : cat;
    if(!grouped[groupKey]) grouped[groupKey] = [];
    grouped[groupKey].push({...it, _idx: idx});

  // 그룹별 렌더링

    const special = ['상설', '씨푸드파티존', '상설행사', '먹거리'];
    const aSp = special.some(s => a.includes(s));
    const bSp = special.some(s => b.includes(s));
    if(aSp && !bSp) return -1;
    if(!aSp && bSp) return 1;
    return a.localeCompare(b);
  }).forEach(groupKey => {
    const groupItems = grouped[groupKey];
    // 그룹 헤더
    const isDate = /^\d{4}-\d{2}-\d{2}$/.test(groupKey);
    const dispHeader = isDate ? formatDateHeader(groupKey) : groupKey;

          <div class="row" style="gap:6px">
            <div class="lbl" style="min-width:60px">카테고리</div>
            <select onchange="updateProgItem(${i},'category',this.value); renderProgList(_progItems)" style="padding:6px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px">
              <option value="일자별" ${it.category === '일자별' || !it.category ? 'selected' : ''}>일자별</option>
              <option value="상설행사" ${it.category === '상설행사' ? 'selected' : ''}>상설행사</option>
              <option value="먹거리" ${it.category === '먹거리' ? 'selected' : ''}>먹거리/부스</option>
              <option value="공연" ${it.category === '공연' ? 'selected' : ''}>공연</option>
              <option value="체험" ${it.category === '체험' ? 'selected' : ''}>체험</option>
              <option value="기타" ${it.category === '기타' ? 'selected' : ''}>기타</option>
            </select>
            ${it.category === '일자별' || !it.category ? `
              <div class="lbl" style="min-width:40px;margin-left:8px">날짜</div>
              <input type="date" value="${escapeAttr(it.date||'')}" onchange="updateProgItem(${i},'date',this.value); renderProgList(_progItems)" style="padding:6px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px">
            ` : ''}
          </div>
          <div class="row" style="gap:6px">
            <div class="lbl" style="min-width:60px">시간</div>
            <input type="text" placeholder="시작 (예: 13:00 또는 오후 1시)" value="${escapeAttr(it.time||'')}" oninput="updateProgItem(${i},'time',this.value)" style="flex:1;padding:6px 8px;font-size:13px">
            <span style="color:#94a3b8;font-size:12px">~</span>
            <input type="text" placeholder="종료 (선택)" value="${escapeAttr(it.endTime||'')}" oninput="updateProgItem(${i},'endTime',this.value)" style="flex:1;padding:6px 8px;font-size:13px">
          </div>
          <div class="row">
            <div class="lbl" style="min-width:60px">행사명</div>
            <input type="text" placeholder="예: 마당극 '무창포, 폭식 속있수다'" value="${escapeAttr(it.title||'')}" oninput="updateProgItem(${i},'title',this.value)">
          </div>
          <div class="row" style="gap:6px">
            <div class="lbl" style="min-width:60px">장소</div>
            <input type="text" placeholder="예: 잔디광장" value="${escapeAttr(it.loc||'')}" oninput="updateProgItem(${i},'loc',this.value)" style="flex:1;padding:6px 8px;font-size:13px">
            <div class="lbl" style="min-width:40px;margin-left:4px">가격</div>
            <input type="text" placeholder="예: 만원, 무료" value="${escapeAttr(it.price||'')}" oninput="updateProgItem(${i},'price',this.value)" style="width:80px;padding:6px 8px;font-size:13px">
          </div>
          <div class="row" style="gap:6px">
            <div class="lbl" style="min-width:60px">대상</div>
            <select onchange="updateProgItem(${i},'audience',this.value)" style="padding:6px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px">

              <option value="어린이" ${it.audience === '어린이' ? 'selected' : ''}>어린이</option>
              <option value="가족" ${it.audience === '가족' ? 'selected' : ''}>가족</option>
            </select>

            <select onchange="updateProgItem(${i},'reservation',this.value)" style="padding:6px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px">
              <option value="" ${!it.reservation ? 'selected' : ''}>-</option>
              <option value="현장접수" ${it.reservation === '현장접수' ? 'selected' : ''}>현장접수</option>
              <option value="사전예약" ${it.reservation === '사전예약' ? 'selected' : ''}>사전예약</option>
              <option value="자유참여" ${it.reservation === '자유참여' ? 'selected' : ''}>자유참여</option>
            </select>
            <input type="text" placeholder="비고 (선택)" value="${escapeAttr(it.note||'')}" oninput="updateProgItem(${i},'note',this.value)" style="flex:1;margin-left:8px;padding:6px 8px;font-size:12px">
          </div>
        </div>`;
    });
    
    html += `</div></div>`;
  });
  
  box.innerHTML = html;
}

// 날짜 헤더 포맷 (2026-09-19 → 9.19 (금))
function formatDateHeader(dateStr){
  if(!dateStr || dateStr === '기타') return dateStr;
  try {
    const d = new Date(dateStr);
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const dow = ['일','월','화','수','목','금','토'][d.getDay()];
    return `${m}.${day} (${dow})`;
  } catch(e) {
    return dateStr;
  }
}

}

    alert('엑셀 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.');
    return;
  }
  
  try {
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data);
    
    // 첫 번째 시트 읽기 (프로그램 시트)
    const sheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ''});
    
    if(rows.length < 2){
      alert('데이터가 없습니다. 양식을 다운로드해서 작성해주세요.');
      return;
    }
    
    // 헤더 찾기 (첫 행)
    const header = rows[0].map(h => String(h).trim());
    console.log('엑셀 헤더:', header);
    
    // 열 인덱스 매핑
    const colMap = {
      category: header.findIndex(h => h.includes('카테고리') || h.includes('구분')),
      date: header.findIndex(h => h.includes('날짜') || h.includes('일자')),
      time: header.findIndex(h => h.includes('시작') || (h.includes('시간') && !h.includes('종료'))),
      endTime: header.findIndex(h => h.includes('종료')),
      title: header.findIndex(h => h.includes('행사') || h.includes('제목') || h.includes('프로그램') || h.includes('내용')),
      loc: header.findIndex(h => h.includes('장소') || h.includes('위치')),
      price: header.findIndex(h => h.includes('가격') || h.includes('요금') || h.includes('비용')),
      audience: header.findIndex(h => h.includes('대상')),
      reservation: header.findIndex(h => h.includes('예약') || h.includes('접수'))
    };
    
    console.log('열 매핑:', colMap);
    
    // 제목 열은 필수
    if(colMap.title === -1){
      alert('행사명 열을 찾을 수 없습니다.\n양식의 헤더를 확인해주세요.');
      return;
    }
    
    // 데이터 파싱 (2행부터)
    const newPrograms = [];
    for(let i = 1; i < rows.length; i++){
      const row = rows[i];
      const getVal = (idx) => idx >= 0 && row[idx] != null ? String(row[idx]).trim() : '';
      
      const title = getVal(colMap.title);
      if(!title) continue; // 행사명 없으면 스킵
      
      // 날짜 형식 정규화
      let dateVal = getVal(colMap.date);
      if(dateVal){
        // 엑셀 날짜 시리얼 번호 처리
        if(/^\d+$/.test(dateVal) && Number(dateVal) > 40000){
          const excelDate = XLSX.SSF.parse_date_code(Number(dateVal));
          if(excelDate){
            dateVal = `${excelDate.y}-${String(excelDate.m).padStart(2,'0')}-${String(excelDate.d).padStart(2,'0')}`;
          }
        }
        // 다양한 날짜 형식 처리 (9.19, 9/19 등)
        else if(/^\d{1,2}[./]\d{1,2}$/.test(dateVal)){
          const parts = dateVal.split(/[./]/);
          const year = new Date().getFullYear();
          dateVal = `${year}-${parts[0].padStart(2,'0')}-${parts[1].padStart(2,'0')}`;
        }
      }
      
      // 시간 형식 정규화
      let timeVal = getVal(colMap.time);
      // 엑셀 시간 시리얼 처리 (0.xxx)
      if(/^0\.\d+$/.test(timeVal)){
        const totalMin = Math.round(Number(timeVal) * 24 * 60);
        const h = Math.floor(totalMin / 60);
        const m = totalMin % 60;
        timeVal = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      }
      
      let endTimeVal = getVal(colMap.endTime);
      if(/^0\.\d+$/.test(endTimeVal)){
        const totalMin = Math.round(Number(endTimeVal) * 24 * 60);
        const h = Math.floor(totalMin / 60);
        const m = totalMin % 60;
        endTimeVal = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      }
      
      newPrograms.push({
        category: getVal(colMap.category) || '일자별',
        date: dateVal,
        time: timeVal,
        endTime: endTimeVal,
        title: title,
        loc: getVal(colMap.loc),
        price: getVal(colMap.price),
        audience: getVal(colMap.audience),
        reservation: getVal(colMap.reservation),
        note: ''
      });
    }
    
    if(!newPrograms.length){
      alert('추출된 프로그램이 없습니다.\n행사명이 입력되어 있는지 확인해주세요.');
      return;
    }
    
    // 기존 항목에 추가
    _progItems = _progItems.concat(newPrograms);
    renderProgList(_progItems);
    
    // 파일 input 초기화
    document.getElementById('prog-excel-file').value = '';
    
    toast(`${newPrograms.length}개 프로그램이 추가되었습니다!`, 'success');
    console.log(`✅ 엑셀에서 ${newPrograms.length}개 프로그램 추가`);
    
  } catch(err){
    console.error('엑셀 처리 실패:', err);
    alert('엑셀 파일을 읽을 수 없습니다.\n\n' + err.message);
    document.getElementById('prog-excel-file').value = '';
  }
}

const GOODS_CATEGORIES = ['인형/완구','생활용품','문구/소품','가방','의류','액세서리','식품','기타'];

let _goodsItems = [];

function renderGoodsList(items){
  _goodsItems = items.map(it=>({...it}));
  const box = document.getElementById('goods-list');
  if(!box) return;
  if(!_goodsItems.length){
    box.innerHTML = `<div class="prog-empty">아직 등록된 굿즈가 없습니다.<br>위의 "+ 굿즈 추가" 버튼을 눌러 시작하세요.</div>`;
    return;
  }
  const catOpts = GOODS_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('');

  box.innerHTML = _goodsItems.map((it, i)=>{
    const stock = it.stock || '여유';
    const cat = it.cat || '';
    const discount = parseInt(it.discount) || 0;
    const soldOut = !!it.soldOut;
    const finalPrice = discount > 0 ? Math.round((it.price||0) * (100-discount)/100) : null;
    return `
    <div class="prog-item">
      <button type="button" class="del-x" onclick="removeGoodsItem(${i})" title="삭제">×</button>
      <div class="row">
        <div class="lbl">상품명 *</div>
        <input type="text" placeholder="예: 벚꽃 마스코트 인형" value="${escapeAttr(it.name||'')}" oninput="updateGoodsItem(${i},'name',this.value)">
      </div>
      <div class="row">
        <div class="lbl">한 줄 설명</div>
        <div style="display:flex;gap:4px;flex:1">
          <input type="text" placeholder="예: 사이즈 S/M 두 종류" value="${escapeAttr(it.desc||'')}" oninput="updateGoodsItem(${i},'desc',this.value)" style="flex:1">
          <button type="button" onclick="showQuickPhrasesForItem('goods-desc','goods',${i},'desc',this)" style="padding:4px 8px;border:1px solid #e5e7eb;border-radius:5px;background:#f8fafc;font-size:11px;cursor:pointer;flex-shrink:0" title="자주 쓰는 문구 선택">💡 추천</button>
        </div>
      </div>
      <div class="row">
        <div class="lbl">가격 (원)</div>
        <input type="number" min="0" step="100" placeholder="15000" value="${it.price||''}" oninput="updateGoodsPrice(${i},this.value)">
      </div>
      <div class="row">
        <div class="lbl">카테고리</div>
        <select onchange="updateGoodsItem(${i},'cat',this.value)" style="padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:7px;font-size:12px;font-family:inherit;background:#fff">
          <option value="">선택</option>
          ${GOODS_CATEGORIES.map(c=>`<option value="${c}" ${cat===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="row">
        <div class="lbl">할인율 (%)</div>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="number" min="0" max="90" placeholder="0" value="${discount}" oninput="updateGoodsDiscount(${i},this.value)" style="flex:1">
          ${finalPrice ? `<span style="font-size:11px;color:#dc2626;font-weight:700;white-space:nowrap">→ ${finalPrice.toLocaleString()}원</span>` : ''}
        </div>
      </div>
      <div class="row">
        <div class="lbl">재고 상태</div>
        <select onchange="updateGoodsItem(${i},'stock',this.value)" style="padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:7px;font-size:12px;font-family:inherit;background:#fff">
          <option value="여유" ${stock==='여유'?'selected':''}>🟢 여유</option>
          <option value="한정" ${stock==='한정'?'selected':''}>🟡 한정</option>
          <option value="임박" ${stock==='임박'?'selected':''}>🔴 임박 (곧 소진)</option>
        </select>
      </div>
      <div class="row">
        <div class="lbl">사진 URL</div>
        <input type="text" placeholder="https://..." value="${escapeAttr(it.img||'')}" oninput="updateGoodsImg(${i},this.value)">
      </div>
      ${it.img ? `<div style="padding-left:98px"><div class="goods-thumb" style="background-image:url('${escapeAttr(it.img)}')"></div></div>` : ''}
      <div class="row">
        <div class="lbl">품절 처리</div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#475569;cursor:pointer">
          <input type="checkbox" ${soldOut?'checked':''} onchange="updateGoodsItem(${i},'soldOut',this.checked);renderGoodsList(_goodsItems)" style="width:16px;height:16px">
          ${soldOut ? '<span class="goods-badge gb-soldout">SOLD OUT</span>' : '품절로 표시'}
        </label>
      </div>
    </div>`;
  }).join('');
}

function addGoodsItem(){
  _goodsItems.push({
    name: '',
    desc: '',
    price: 0,
    cat: '',
    discount: 0,
    stock: '여유',
    img: '',
    soldOut: false
  });
  renderGoodsList(_goodsItems);
}

function removeGoodsItem(i){
  _goodsItems.splice(i, 1);
  renderGoodsList(_goodsItems);
}

function updateGoodsItem(i, key, val){
  if(_goodsItems[i]) _goodsItems[i][key] = val;
}

function updateGoodsPrice(i, val){
  if(_goodsItems[i]) _goodsItems[i].price = parseInt(val) || 0;
  // 할인가 표시 갱신
  renderGoodsList(_goodsItems);
}

function updateGoodsDiscount(i, val){
  if(_goodsItems[i]) _goodsItems[i].discount = parseInt(val) || 0;
  // 할인가 표시 갱신
  renderGoodsList(_goodsItems);
}

function updateGoodsImg(i, val){
  if(_goodsItems[i]) _goodsItems[i].img = val;
  // 미리보기 갱신 (디바운스 없이 즉시는 깜빡임이 심해서 입력 멈춤 후만)
  clearTimeout(window._goodsImgT);
  window._goodsImgT = setTimeout(()=>renderGoodsList(_goodsItems), 600);
}

      <div class="row">

        <input type="text" placeholder="예: 안내소 앞 키오스크 자동 대여" value="${escapeAttr(it.desc||'')}" oninput="updateRentalItem(${i},'desc',this.value)">

      <div class="row">
        <div class="lbl">가격/조건</div>
        <div style="display:flex;gap:6px;align-items:center">

      <div class="row">
        <div class="lbl">위도 (lat)</div>
        <input type="number" step="0.000001" placeholder="37.5280" value="${it.lat||''}" oninput="updateRentalItem(${i},'lat',parseFloat(this.value)||null)">
      </div>
      <div class="row">
        <div class="lbl">경도 (lng)</div>
        <input type="number" step="0.000001" placeholder="126.9325" value="${it.lng||''}" oninput="updateRentalItem(${i},'lng',parseFloat(this.value)||null)">

function selectRentalPreset(i, label){
  if(!label) return;
  const preset = RENTAL_PRESETS.find(p => p.label === label);
  if(preset){
    _rentalItems[i].icon = preset.icon;
    _rentalItems[i].label = preset.label;
    renderRentalList(_rentalItems);
  }
}

function addRentalItem(){

// ───────────────────────────────────────────────────────
// 기간 표시 텍스트("MM.DD - MM.DD")에서 시작일/종료일 추출
// ───────────────────────────────────────────────────────
function parseDateRangeStart(dateStr){
  if(!dateStr) return '';
  const match = dateStr.match(/(\d{1,2})\.(\d{1,2})/);
  if(!match) return '';
  const year = new Date().getFullYear();
  const m = String(match[1]).padStart(2, '0');
  const d = String(match[2]).padStart(2, '0');
  return `${year}-${m}-${d}`;
}

function parseDateRangeEnd(dateStr){
  if(!dateStr) return '';
  const matches = [...dateStr.matchAll(/(\d{1,2})\.(\d{1,2})/g)];
  if(matches.length < 2) return '';
  const year = new Date().getFullYear();
  const last = matches[matches.length - 1];
  const m = String(last[1]).padStart(2, '0');
  const d = String(last[2]).padStart(2, '0');
  return `${year}-${m}-${d}`;
}

// 달력에서 날짜 선택했을 때 기간 표시 텍스트 자동 업데이트
function updateDateDisplay(){
  const startVal = document.getElementById('m-startdate').value;
  const endVal = document.getElementById('m-enddate').value;
  if(!startVal && !endVal) return;
  
  const fmt = (val) => {
    if(!val) return '';
    const parts = val.split('-');
    return `${parts[1]}.${parts[2]}`;
  };
  
  const startFmt = fmt(startVal);
  const endFmt = fmt(endVal);
  
  let display = '';
  if(startFmt && endFmt){
    display = `${startFmt} - ${endFmt}`;
  } else if(startFmt){
    display = startFmt;
  } else if(endFmt){
    display = endFmt;
  }
  
  document.getElementById('m-date').value = display;
}

// 주소 → 좌표 변환 (Nominatim API - OpenStreetMap 기반, 무료)
// ───────────────────────────────────────────────────────
async function searchAddress(){
  const addr = document.getElementById('m-address').value.trim();
  const resultBox = document.getElementById('addr-search-result');
  
  if(!addr){
    resultBox.innerHTML = '<span style="color:#ef4444">주소를 입력해주세요</span>';
    return;
  }
  
  resultBox.innerHTML = '<span style="color:#ef8200">⏳ 검색 중...</span>';
  
  try {
    // Nominatim API 호출 (한국 지역으로 제한)
    const url = `https://nominatim.openstreetmap.org/search?` + 
                `q=${encodeURIComponent(addr)}` +
                `&format=json` +
                `&limit=5` +
                `&countrycodes=kr` +
                `&accept-language=ko`;
    
    const response = await fetch(url, {
      headers: {
        'Accept': 'application/json'
        // User-Agent는 브라우저가 자동 설정 (수동 설정 불가)
      }
    });
    
    if(!response.ok){
      throw new Error(`서버 응답 오류: ${response.status}`);
    }
    
    const results = await response.json();
    
    if(results && results.length > 0){
      const item = results[0];
      const lat = parseFloat(item.lat);
      const lng = parseFloat(item.lon);
      
      // 한국 좌표 범위 확인 (위도 33~43, 경도 124~132)
      if(lat < 33 || lat > 43 || lng < 124 || lng > 132){
        resultBox.innerHTML = '<span style="color:#ef4444">⚠️ 한국 좌표 범위가 아닙니다. 다른 주소를 시도해보세요</span>';
        return;
      }
      
      // 좌표 자동 입력
      document.getElementById('m-lat').value = lat.toFixed(6);
      document.getElementById('m-lng').value = lng.toFixed(6);
      
      // 결과 표시
      const displayName = item.display_name || addr;
      resultBox.innerHTML = `<span style="color:#10b981">✓ 좌표: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br><span style="font-size:12px;color:#64748b">📍 ${displayName}</span></span>`;
      toast('주소가 좌표로 변환되었습니다', 'success');
      
      // 여러 결과가 있으면 안내
      if(results.length > 1){
        const otherCount = results.length - 1;
        resultBox.innerHTML += `<br><span style="font-size:12px;color:#94a3b8">(다른 결과 ${otherCount}개 발견 - 정확하지 않으면 더 자세한 주소를 입력해보세요)</span>`;
      }
    } else {
      resultBox.innerHTML = `
        <span style="color:#ef4444">❌ 주소를 찾을 수 없습니다</span><br>
        <span style="font-size:12px;color:#64748b">
        💡 입력 팁:<br>
        • "서울특별시 중랑구 묵동" 처럼 시·구·동 단위로<br>
        • 큰 단위부터 작은 단위로 (도→시→구→동)<br>
        • 도로명 주소도 가능 (예: "강남대로 396")
        </span>`;
    }
  } catch(e) {
    console.error('주소 검색 오류:', e);
    resultBox.innerHTML = `<span style="color:#ef4444">❌ 검색 실패: ${e.message}</span>`;
  }
}

// 공식 라이브러리 래퍼 함수
function olcDecode(code){
  try {
    if(!window.OpenLocationCode) return null;
    const olc = new window.OpenLocationCode();
    const area = olc.decode(code);
    return {
      lat: area.latitudeCenter,
      lng: area.longitudeCenter,
      latPrec: area.latitudeHi - area.latitudeLo,
      lngPrec: area.longitudeHi - area.longitudeLo
    };
  } catch(e) {
    console.error('olcDecode 실패:', e);
    return null;
  }
}

function olcEncode(lat, lng, codeLength){
  try {
    if(!window.OpenLocationCode) return null;
    const olc = new window.OpenLocationCode();
    return olc.encode(lat, lng, codeLength || 10);
  } catch(e) {
    console.error('olcEncode 실패:', e);
    return null;
  }
}

function olcRecoverNearest(shortCode, refLat, refLng){
  try {
    if(!window.OpenLocationCode) return null;
    const olc = new window.OpenLocationCode();
    return olc.recoverNearest(shortCode, refLat, refLng);
  } catch(e) {
    console.error('olcRecoverNearest 실패:', e);
    return null;
  }
}

function olcEncodeFull(lat, lng){
  return olcEncode(lat, lng, 10);
}

async function convertPlusCode(){
  const input = document.getElementById('m-pluscode').value.trim();
  const resultBox = document.getElementById('pluscode-result');
  
  if(!input){
    resultBox.innerHTML = '<span style="color:#ef4444">Plus Code를 입력해주세요</span>';
    return;
  }
  
  resultBox.innerHTML = '<span style="color:#ef8200">⏳ 변환 중...</span>';
  
  try {
    let fullCode = input.replace(/\s+/g, ' ').trim();
    let lat, lng;
    
    // 짧은 코드 + 지역명 형태 (예: "J37F+X5 서울특별시")
    const parts = fullCode.split(/\s+/);
    const codePart = parts[0].toUpperCase();
    
    // 코드 부분에 '+'가 있고, '+' 앞이 8자 미만이면 짧은 코드
    const plusIdx = codePart.indexOf('+');
    if(plusIdx > 0 && plusIdx < 8 && parts.length > 1){
      // 짧은 코드 처리
      const locationPart = parts.slice(1).join(' ');
      
      resultBox.innerHTML = '<span style="color:#ef8200">⏳ 지역 좌표 검색 중...</span>';
      
      // 지역명을 먼저 좌표로 변환
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(locationPart)}&format=json&limit=1&countrycodes=kr&accept-language=ko`;
      const response = await fetch(url);
      const results = await response.json();
      
      if(!results || results.length === 0){
        resultBox.innerHTML = `<span style="color:#ef4444">❌ "${locationPart}" 지역을 찾을 수 없습니다</span>`;
        return;
      }
      
      const refLat = parseFloat(results[0].lat);
      const refLng = parseFloat(results[0].lon);
      
      // 짧은 코드 → 전체 코드 복구
      const recovered = olcRecoverNearest(codePart, refLat, refLng);
      if(!recovered){
        resultBox.innerHTML = '<span style="color:#ef4444">❌ Plus Code 복구에 실패했습니다</span>';
        return;
      }
      fullCode = recovered;
    } else {
      // 전체 코드 형태
      fullCode = codePart;
    }
    
    // 디코딩
    const decoded = olcDecode(fullCode);
    if(!decoded){
      resultBox.innerHTML = `
        <span style="color:#ef4444">❌ 올바른 Plus Code가 아닙니다</span><br>
        <span style="font-size:12px;color:#64748b">
        💡 형식 예시:<br>
        • 전체 코드: <code>8Q98H49R+G7</code><br>
        • 짧은 코드: <code>H49R+G7 Seoul</code> 또는 <code>J37F+X5 서울특별시</code><br>
        • Google 지도에서 위치 클릭 → 좌표 칸 아래에 표시됨
        </span>`;
      return;
    }
    
    lat = decoded.lat;
    lng = decoded.lng;
    
    // 한국 좌표 범위 확인
    if(lat < 33 || lat > 43 || lng < 124 || lng > 132){
      resultBox.innerHTML = `<span style="color:#ef4444">⚠️ 한국 좌표 범위가 아닙니다 (위도: ${lat.toFixed(4)}, 경도: ${lng.toFixed(4)})</span>`;
      return;
    }
    
    // 좌표 자동 입력
    document.getElementById('m-lat').value = lat.toFixed(6);
    document.getElementById('m-lng').value = lng.toFixed(6);
    
    resultBox.innerHTML = `
      <span style="color:#10b981">✓ 좌표: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br>
      <span style="font-size:12px;color:#64748b">📍 Plus Code: ${fullCode}</span></span>`;
    toast('Plus Code가 좌표로 변환되었습니다', 'success');
    
  } catch(e) {
    console.error('Plus Code 변환 오류:', e);
    resultBox.innerHTML = `<span style="color:#ef4444">❌ 변환 실패: ${e.message}</span>`;
  }
}

// Firebase Storage 이미지 업로드
async function uploadImageFile(input){
  const file = input.files[0];
  if(!file) return;
  
  // 파일 크기 체크 (5MB 제한)
  if(file.size > 5 * 1024 * 1024){
    toast('파일 크기가 너무 큽니다 (최대 5MB)', 'error');
    input.value = '';
    return;
  }
  
  // 이미지 파일인지 체크
  if(!file.type.startsWith('image/')){
    toast('이미지 파일만 업로드 가능합니다', 'error');
    input.value = '';
    return;
  }
  
  const btn = document.getElementById('m-img-upload-btn');
  const status = document.getElementById('m-img-upload-status');
  const originalBtnText = btn.textContent;
  
  try {
    // Storage 객체 확인
    if(!storage){
      try { storage = firebase.storage(); }
      catch(e){
        toast('Storage가 초기화되지 않았습니다', 'error');
        return;
      }
    }
    
    btn.disabled = true;
    btn.textContent = '⏳ 업로드 중...';
    status.textContent = '0%';
    status.style.color = '#ef8200';
    
    // 파일명 만들기 (한글/특수문자 안전하게)
    const timestamp = Date.now();
    const random = Math.random().toString(36).substring(2, 8);
    const ext = file.name.split('.').pop().toLowerCase();
    const safeName = `festivals/${timestamp}_${random}.${ext}`;
    
    // Storage에 업로드
    const storageRef = storage.ref(safeName);
    const uploadTask = storageRef.put(file);
    
    // 진행률 표시
    uploadTask.on('state_changed',
      (snapshot) => {
        const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
        status.textContent = `${progress}%`;
      },
      (error) => {
        console.error('Upload error:', error);
        toast('업로드 실패: ' + error.message, 'error');
        btn.disabled = false;
        btn.textContent = originalBtnText;
        status.textContent = '';
      },
      async () => {
        // 업로드 완료 → URL 받아오기
        try {
          const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
          
          // URL을 입력란에 자동 입력
          document.getElementById('m-img').value = downloadURL;
          updatePreview();
          
          // 성공 표시
          btn.disabled = false;
          btn.textContent = originalBtnText;
          status.textContent = '✓ 업로드 완료';
          status.style.color = '#10b981';
          toast('사진이 업로드되었습니다', 'success');
          
          // 3초 뒤 상태 메시지 지우기
          setTimeout(() => {
            status.textContent = '';
          }, 3000);
        } catch(e){
          console.error('URL 가져오기 실패:', e);
          toast('URL 가져오기 실패', 'error');
          btn.disabled = false;
          btn.textContent = originalBtnText;
          status.textContent = '';
        }
      }
    );
  } catch(e) {
    console.error('업로드 오류:', e);
    toast('업로드 중 오류가 발생했습니다', 'error');
    btn.disabled = false;
    btn.textContent = originalBtnText;
    status.textContent = '';
  }
  
  // 같은 파일 다시 업로드 가능하게
  input.value = '';
}

function downloadCSV(){
  const headers = ['title','region','tag','loc','date','lat','lng','img','cong','rating','idata'];
  const rows = festivals.map(f=>headers.map(h=>{
    let v = f[h];
    if(v == null) v = '';
    if(typeof v === 'boolean') v = v ? '1' : '0';
    v = String(v).replace(/"/g, '""');
    if(v.includes(',') || v.includes('"') || v.includes('\n')) v = `"${v}"`;
    return v;
  }).join(','));
  const csv = '\ufeff' + headers.join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `나들이go_축제_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast(`${festivals.length}개 다운로드 완료`, 'success');
}

async function uploadCSV(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  if(!confirm(`CSV 파일의 축제를 추가합니다.\n파일: ${file.name}\n계속하시겠습니까?`)) return;
  try{
    const text = await file.text();
    const lines = text.replace(/^\ufeff/, '').split(/\r?\n/).filter(l=>l.trim());
    if(lines.length < 2) throw new Error('데이터가 없습니다');
    const headers = parseCSVLine(lines[0]);
    const batch = db.batch();
    let added = 0;
    const startOrder = Math.max(0, ...festivals.map(f=>f._order||0)) + 1;
    for(let i=1; i<lines.length; i++){
      const cells = parseCSVLine(lines[i]);
      const obj = {};
      headers.forEach((h, idx)=>{ obj[h] = cells[idx] || ''; });
      if(!obj.title) continue;
      const data = {
        title: obj.title,
        region: obj.region || '기타',
        tag: obj.tag || '지역축제',
        loc: obj.loc || '',
        date: obj.date || '',
        lat: parseFloat(obj.lat) || 37.5,
        lng: parseFloat(obj.lng) || 127.0,
        img: obj.img || '',
        cong: parseInt(obj.cong) || 50,
        rating: parseFloat(obj.rating) || 4.5,
        idata: obj.idata === '1' || obj.idata === 'true',
        reviews: [],
        mx: '50%', my: '50%',
        _order: startOrder + added,
        id: 'f' + Date.now() + '_' + added,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      const ref = db.collection('festivals').doc();
      batch.set(ref, data);
      added++;
    }
    await batch.commit();
    toast(`${added}개 추가 완료`, 'success');
    await loadFestivals();
  }catch(err){
    toast('CSV 업로드 실패: '+err.message, 'error');
  }
}

function parseCSVLine(line){
  const result = [];
  let cur = '', inQuote = false;
  for(let i=0; i<line.length; i++){
    const c = line[i];
    if(inQuote){
      if(c === '"' && line[i+1] === '"'){ cur += '"'; i++; }
      else if(c === '"') inQuote = false;
      else cur += c;
    }else{
      if(c === '"') inQuote = true;
      else if(c === ','){ result.push(cur); cur = ''; }
      else cur += c;
    }
  }
  result.push(cur);
  return result;
}

    +'<div style="width:40px;height:40px;border-radius:50%;background:#ef8200;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;">'+mgrEsc((u.name||'?')[0])+'</div>'
    +'<div style="flex:1;min-width:180px;"><div style="font-weight:800;">'+mgrEsc(u.name||'(닉네임 없음)')+' <span style="font-weight:400;color:#94a3b8;font-size:12px;">@'+mgrEsc(u.id||u._id)+'</span></div>'
    +'<div style="font-size:12px;color:#64748b;margin-top:2px;">이름: '+mgrEsc(u.realName||'-')+' · 전화: '+mgrEsc(u.phone||'-')+' · 가입: '+mgrDate(u.createdAt)+'</div></div>'
    +'<button onclick="mgrDelUser(\''+mgrEsc(u._id)+'\')" style="padding:8px 13px;border-radius:9px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:#fef2f2;color:#dc2626;font-family:inherit;">회원 삭제</button>'
    +'</div>').join('');
}

function renderPosts(){
  const q=(document.getElementById('p-search').value||'').trim().toLowerCase();
  const rows=MGR_POSTS.filter(p=>!q||String(p.title||'').toLowerCase().includes(q)||String(p.author||'').toLowerCase().includes(q));
  const list=document.getElementById('p-list');
  const reported=MGR_POSTS.filter(p=>(p.reports||0)>0).length;
  if(!rows.length){ list.innerHTML='<div style="text-align:center;color:#94a3b8;padding:50px 0;">게시물이 없습니다</div>'; return; }
  list.innerHTML='<div style="font-size:12px;color:#94a3b8;margin-bottom:10px;">동행 게시물 '+MGR_POSTS.length+'건 · <span style="color:'+(reported?'#dc2626':'#16a34a')+';font-weight:700;">신고된 글 '+reported+'건</span></div>'
    +rows.map(p=>{
      const rep=p.reports||0;
      const hidden=p.hidden===true||rep>=3;
      return '<div style="background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;border:1px solid '+(rep>0?'#fecaca':'#eef2f7')+';">'
        +'<div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;">'
        +'<div style="flex:1;min-width:200px;"><div style="font-weight:800;">'+mgrEsc(p.title||'(제목 없음)')+' '
        +(hidden?'<span style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:#f1f5f9;color:#64748b;">숨김</span>':'<span style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:#f0fdf4;color:#16a34a;">노출 중</span>')
        +(rep>0?' <span style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:#fef2f2;color:#dc2626;">🚨 신고 '+rep+'회</span>':'')+'</div>'
        +'<div style="font-size:12px;color:#64748b;margin-top:3px;line-height:1.6;">작성: '+mgrEsc(p.author||'익명')+' · '+mgrEsc(p.festName||'')+' · '+mgrDate(p.createdAt)+'<br>'+mgrEsc(String(p.desc||'').slice(0,80))+'</div></div>'
        +'<div style="display:flex;gap:6px;flex-wrap:wrap;">'
        +(hidden
          ?'<button onclick="mgrHide(\''+mgrEsc(p._id)+'\',false)" style="padding:8px 13px;border-radius:9px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:#fff7ed;color:#ef8200;font-family:inherit;">노출하기</button>'
          :'<button onclick="mgrHide(\''+mgrEsc(p._id)+'\',true)" style="padding:8px 13px;border-radius:9px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:#f1f5f9;color:#475569;font-family:inherit;">숨기기</button>')
        +(rep>0?'<button onclick="mgrResetRep(\''+mgrEsc(p._id)+'\')" style="padding:8px 13px;border-radius:9px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:#eff6ff;color:#2563eb;font-family:inherit;">신고 초기화</button>':'')
        +'<button onclick="mgrDelPost(\''+mgrEsc(p._id)+'\')" style="padding:8px 13px;border-radius:9px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:#fef2f2;color:#dc2626;font-family:inherit;">삭제</button>'
        +'</div></div></div>';
    }).join('');
}

async function mgrDelUser(id){
  if(!confirm('이 회원을 삭제할까요?\n삭제하면 해당 아이디로 다시 로그인할 수 없습니다.')) return;
  try{
    await db.collection('app_users').doc(id).delete();
    await db.collection('push_tokens').doc('id_'+id).delete().catch(()=>{});
    MGR_USERS=MGR_USERS.filter(u=>u._id!==id); renderUsers();
  }catch(e){ alert('삭제 실패: '+e.message); }
}
async function mgrHide(id,v){
  try{
    await db.collection('mate_posts').doc(id).set({hidden:v},{merge:true});
    const p=MGR_POSTS.find(x=>x._id===id); if(p) p.hidden=v; renderPosts();
  }catch(e){ alert('처리 실패: '+e.message); }
}
async function mgrResetRep(id){
  if(!confirm('신고 횟수를 0으로 초기화할까요? (문제없는 글로 확인된 경우)')) return;
  try{
    await db.collection('mate_posts').doc(id).set({reports:0,hidden:false},{merge:true});
    const p=MGR_POSTS.find(x=>x._id===id); if(p){p.reports=0;p.hidden=false;} renderPosts();
  }catch(e){ alert('처리 실패: '+e.message); }
}
async function mgrDelPost(id){
  if(!confirm('이 게시물을 완전히 삭제할까요?\n관련 채팅 메시지도 함께 삭제됩니다.')) return;
  try{
    await db.collection('mate_posts').doc(id).delete();
    const chats=await db.collection('mate_chats').get();
    const batch=db.batch(); let n=0;
    chats.forEach(doc=>{ const rid=String(doc.data().roomId||''); if(rid===id||rid.indexOf(id+'_')===0){batch.delete(doc.ref);n++;} });
    if(n>0) await batch.commit();
    MGR_POSTS=MGR_POSTS.filter(p=>p._id!==id); renderPosts();
  }catch(e){ alert('삭제 실패: '+e.message); }
}
</script>
</body>
</html>
